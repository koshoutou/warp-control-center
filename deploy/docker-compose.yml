# ====================================================================
# WARP 控制中心 —— Docker Compose 部署
# 一条命令启动: 面板(:3000) + 代理(:40000) + warp-svc
# ====================================================================
services:
  warp-control-center:
    build:
      context: ..
      dockerfile: Dockerfile
    image: warp-control-center:latest
    container_name: warp-control-center
    restart: unless-stopped

    # 端口映射
    ports:
      - "40000:40000"   # 代理端口（SOCKS5 + HTTP CONNECT）
      - "3000:3000"     # 监控面板

    # warp-svc 需要的能力
    cap_add:
      - NET_ADMIN
    # 可选：允许 sys_admin 以便 warp-svc 创建网络命名空间
    # security_opt:
    #   - apparmor:unconfined

    # 环境变量（见 deploy/.env.example）
    environment:
      - AUTO_CONNECT=${AUTO_CONNECT:-true}
      - LICENSE=${LICENSE:-}
      - PROXY_PORT=40000
      - CONTROL_PORT=3030
      - MAX_CONNECTIONS=${MAX_CONNECTIONS:-2048}
      - IDLE_TIMEOUT_MS=${IDLE_TIMEOUT_MS:-120000}
      - METRICS_INTERVAL_MS=${METRICS_INTERVAL_MS:-1000}
      - NEXT_PUBLIC_WARP_API_BASE=
      - SETTINGS_FILE=/var/lib/warp-control/settings.json

    # 资源限制（可选，按需调整）
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 64M

    # 日志大小限制
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:3030/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    # Zero Trust 部署：挂载 mdm.xml（取消注释）
    # volumes:
    #   - ./mdm.xml:/var/lib/cloudflare-warp/mdm.xml:ro

    # WARP 状态 + 运行时配置持久化（推荐，避免每次重启都重新注册/重新配置）
    volumes:
      - warp-state:/var/lib/cloudflare-warp
      - warp-settings:/var/lib/warp-control

volumes:
  warp-state:
  warp-settings:
