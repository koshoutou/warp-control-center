# ====================================================================
# WARP 控制中心 —— Nginx 反向代理配置（生产推荐）
# 部署: sudo cp deploy/nginx/warp-control-center.conf /etc/nginx/sites-available/
#       sudo ln -s /etc/nginx/sites-available/warp-control-center.conf /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# ====================================================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name warp.example.com;  # 改为你的域名
    return 301 https://$host$request_uri;
}

# HTTPS 主服务
server {
    listen 443 ssl http2;
    server_name warp.example.com;  # 改为你的域名

    # SSL 证书（改为你的证书路径）
    ssl_certificate     /etc/letsencrypt/live/warp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/warp.example.com/privkey.pem;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # ---------- 后端 API（:3030）----------
    location /api/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- socket.io WebSocket 升级（:3030）----------
    # socket.io path 为 "/"，握手请求是 /?EIO=4&transport=polling
    # 用 location = / 精确匹配根路径，仅当带 EIO 参数时转发到后端
    location / {
        # 如果是 socket.io engine.io 请求（带 EIO 参数），转发到后端
        if ($arg_EIO) {
            proxy_pass http://127.0.0.1:3030;
        }
        # 否则转发到 Next.js 面板
        try_files $uri @dashboard;
    }

    location @dashboard {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js HMR（开发模式需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Next.js 静态资源（_next/*）
    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 静态资源长期缓存
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 访问日志
    access_log /var/log/nginx/warp-control-center.access.log;
    error_log  /var/log/nginx/warp-control-center.error.log;
}
